name: Sultrix Native Mobile Build (Android & iOS)

on:
  push:
    branches: [ main, Allow-All-Actions ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, Allow-All-Actions ]
  workflow_dispatch:

jobs:
  build-android:
    # Real release signing requires an Android keystore and is not set up yet; this job produces unsigned artifacts.
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets and sync Capacitor
        run: npm run cap:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sultrix-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Android Release APK & AAB
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Release APK / Bundle (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sultrix-Android-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

  build-ios:
    # Real release signing requires an Apple developer account and certificate and is not set up yet; this job produces unsigned artifacts.
    name: Build iOS (IPA & Archive)
    runs-on: macos-latest
    # Independent of Android result: no needs, executes even if Android fails or is cancelled
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets and sync Capacitor
        run: npm run cap:sync

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/App.xcarchive \
            archive

      - name: Package Unsigned IPA
        if: always()
        run: |
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build
            zip -r Sultrix-unsigned.ipa Payload
          else
            echo "Notice: build/App.xcarchive/Products/Applications/App.app not found. Skipping IPA packaging."
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sultrix-iOS-IPA
          path: build/Sultrix-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sultrix-iOS-xcarchive
          path: build/App.xcarchive
          if-no-files-found: ignore
          retention-days: 14
